<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>수업 교체 및 결·보강 도우미</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f5f5f5; margin: 0; color: #333; }
        .header { text-align: center; margin-bottom: 20px; }
        .workspace { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; align-items: flex-start; }
        .pane { flex: 1; background: white; padding: 15px; border-radius: 5px; border: 1px solid #ddd; min-height: 500px; }
        
        input[type="text"], select { width: 100%; padding: 10px; font-size: 15px; border-radius: 3px; border: 1px solid #aaa; box-sizing: border-box; }
        
        table { width: 100%; border-collapse: collapse; text-align: center; table-layout: fixed; user-select: none; caret-color: transparent; }
        th, td { border: 1px solid #ccc; padding: 2px; height: 55px; vertical-align: middle; word-wrap: break-word; font-size: 0.85em; }
        th { background-color: #eee; font-weight: bold; color: #333; height: 35px; }
        
        .free-cell { font-size: 0.8em; }
        .clickable { cursor: pointer; background-color: #f9f9f9; transition: background 0.2s; }
        .clickable:hover { background-color: #e0e0e0; }
        .unswappable { background-color: #fafafa; } 
        
        .selected-a { background-color: #444 !important; color: white !important; font-weight: bold; box-shadow: inset 0 0 0 2px #222; }
        .selected-a-light { background-color: #999 !important; box-shadow: inset 0 0 0 2px #777; }
        .selected-b { background-color: #777 !important; color: white !important; font-weight: bold; box-shadow: inset 0 0 0 2px #555; }
        .selected-b-light { background-color: #bbb !important; box-shadow: inset 0 0 0 2px #999; }
        
        .class-text { font-size: 0.75em; color: #666; display: block; margin-top: 2px; }
        .selected-a .class-text, .selected-b .class-text { color: #ddd; }
        
        .plan-btn { background-color: #555; color: white; border: none; padding: 12px 35px; font-size: 13pt; font-weight: bold; cursor: pointer; border-radius: 4px; transition: background 0.2s; }
        .plan-btn:hover { background-color: #333; }
        .cancel-btn { background-color: #888; color: white; border: none; padding: 12px 35px; font-size: 13pt; font-weight: bold; cursor: pointer; border-radius: 4px; transition: background 0.2s; margin-right: 10px; }
        .cancel-btn:hover { background-color: #666; }
        
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<div class="header"><h2>수업 교체 및 결·보강 도우미</h2></div>

<div class="workspace" id="workspace">
    <div class="pane">
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <input type="text" id="teacherAInput" placeholder="교사명" oninput="onTeacherAChange()" style="flex: 1;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 15px; border: 1px solid #aaa; border-radius: 3px; padding: 0 15px; background-color: white;">
                <label style="cursor: pointer; font-weight: bold; font-size: 14px;"><input type="radio" name="mode" value="swap" checked onchange="onModeChange()"> 교체</label>
                <label style="cursor: pointer; font-weight: bold; font-size: 14px;"><input type="radio" name="mode" value="cover" onchange="onModeChange()"> 보강</label>
            </div>
        </div>
        <div id="tableContainerA"></div>
    </div>
    
    <div class="pane" id="paneB" style="opacity: 0.4; pointer-events: none;">
        <select id="teacherBSelect" onchange="onTeacherBChange()" style="margin-bottom: 15px;"><option value="">선택</option></select>
        <div id="tableContainerB"></div>
    </div>
</div>

<div class="no-print" style="max-width: 1400px; margin: 20px auto; text-align: right;">
    <button onclick="cancelPlan()" class="cancel-btn">취소</button>
    <button onclick="submitPlan()" class="plan-btn">입력</button>
</div>

    const days = ['월', '화', '수', '목', '금'];
    
    let currentTeacherA = ""; let selectedTimeA = ""; let selectedTypeA = ""; let availableSwapsByTeacher = {}; 
    let currentMode = "swap"; let selectedTimeB = ""; 

    window.addEventListener('DOMContentLoaded', () => {
        const prefillTeacher = localStorage.getItem('absentTeacherName');
        if (prefillTeacher) {
            document.getElementById('teacherAInput').value = prefillTeacher;
            onTeacherAChange();
            localStorage.removeItem('absentTeacherName'); 
        }
    });

    function isFree(subject) { return !subject || subject.includes("공강") || subject === ""; }
    function isChangche(subject) { return subject && subject.includes("창체"); }
    function isElective(subject) { return subject && electiveSubjects.some(e => subject.includes(e)); }

    function onModeChange() {
        currentMode = document.querySelector('input[name="mode"]:checked').value;
        selectedTimeA = ""; selectedTimeB = ""; selectedTypeA = ""; resetRightPane();
        if (currentTeacherA) renderTimetableA();
    }

    function onTeacherAChange() {
        const inputVal = document.getElementById('teacherAInput').value.trim();
        if (timetableData[inputVal]) {
            currentTeacherA = inputVal; selectedTimeA = ""; selectedTimeB = ""; selectedTypeA = ""; 
            resetRightPane(); renderTimetableA();
        } else { currentTeacherA = ""; document.getElementById('tableContainerA').innerHTML = ''; resetRightPane(); }
    }

    function renderTimetableA(highlightTimesForA = []) {
        let html = `<table><tr><th>교시</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr>`;
        for(let p=1; p<=7; p++) {
            html += `<tr><td>${p}</td>`;
            for(let d=0; d<5; d++) {
                const timeKey = `${days[d]}-${p}`; const subObj = timetableData[currentTeacherA][timeKey];
                const subject = subObj ? subObj.subject : ""; const classRoom = subObj ? subObj.classRoom : "";
                let cellClass = ""; let content = ""; let onClick = "";

                if (subObj === undefined && !timetableData[currentTeacherA].hasOwnProperty(timeKey)) { content = `<span class="free-cell"></span>`; } 
                else if (isFree(subject)) { content = `<span class="free-cell"></span>`; } 
                else {
                    if (currentMode === "swap" && (isChangche(subject) || isElective(subject))) {
                        cellClass = "unswappable"; content = `<div style="text-decoration: line-through; color: #aaa;"><b>${subject}</b><span class="class-text">${classRoom}</span></div>`;
                    } else {
                        cellClass = "clickable"; content = `<b>${subject}</b><span class="class-text">${classRoom}</span>`;
                        onClick = `onclick="selectTimeA('${timeKey}')"`;
                    }
                }
                
                if (timeKey === selectedTimeA) cellClass += " selected-a";
                else if (timeKey === selectedTimeB) cellClass += " selected-a-light";
                else if (selectedTypeA === "regular" && highlightTimesForA.includes(timeKey) && !selectedTimeB) cellClass += " selected-a-light";

                html += `<td class="${cellClass}" ${onClick}>${content}</td>`;
            }
            html += `</tr>`;
        }
        html += `</table>`;
        document.getElementById('tableContainerA').innerHTML = html;
    }

    function selectTimeA(timeX) {
        selectedTimeA = timeX; selectedTimeB = ""; 
        const schedA = timetableData[currentTeacherA]; const subjectA = schedA[timeX] ? schedA[timeX].subject : "";
        if (currentMode === "swap") { selectedTypeA = "regular"; findRegularSwaps(timeX); } 
        else { 
            if (isChangche(subjectA)) { selectedTypeA = "changche"; findChangcheSubstitutes(); } 
            else { selectedTypeA = "cover"; findCoverSubstitutes(timeX); }
        }
        renderTimetableA(); 
    }

    function findChangcheSubstitutes() {
        availableSwapsByTeacher = {};
        for (let tB in timetableData) { if (tB === currentTeacherA) continue; availableSwapsByTeacher[tB] = []; }
        updateRightPane();
    }

    function findCoverSubstitutes(timeX) {
        availableSwapsByTeacher = {};
        for (let tB in timetableData) {
            if (tB === currentTeacherA) continue;
            let subjectBAtTimeX = timetableData[tB][timeX] ? timetableData[tB][timeX].subject : "";
            if (isFree(subjectBAtTimeX)) availableSwapsByTeacher[tB] = [timeX]; 
        }
        updateRightPane();
    }

    function findRegularSwaps(timeX) {
        availableSwapsByTeacher = {};
        const schedA = timetableData[currentTeacherA]; const targetClass = (schedA[timeX] && schedA[timeX].classRoom) ? schedA[timeX].classRoom : "";
        if (!targetClass) { updateRightPane(); return; }

        for (let tB in timetableData) {
            if (tB === currentTeacherA) continue; let schedB = timetableData[tB];
            let subjectBAtTimeX = schedB[timeX] ? schedB[timeX].subject : "";
            if (isFree(subjectBAtTimeX)) {
                let teacherSwaps = [];
                for (let timeY in schedB) {
                    if (timeY === timeX) continue;
                    let subBObj = schedB[timeY]; let subBSubject = subBObj ? subBObj.subject : "";
                    let subBClass = subBObj ? subBObj.classRoom : ""; let subjectAAtTimeY = schedA[timeY] ? schedA[timeY].subject : "";
                    if (subBClass === targetClass) {
                        if (!isFree(subBSubject) && !isChangche(subBSubject) && !isElective(subBSubject) && isFree(subjectAAtTimeY)) {
                            teacherSwaps.push(timeY);
                        }
                    }
                }
                if (teacherSwaps.length > 0) availableSwapsByTeacher[tB] = teacherSwaps;
            }
        }
        updateRightPane();
    }

    function updateRightPane() {
        const paneB = document.getElementById('paneB'); const selectB = document.getElementById('teacherBSelect');
        paneB.style.opacity = '1'; paneB.style.pointerEvents = 'auto'; selectB.innerHTML = '<option value="">선택</option>';
        const teachers = Object.keys(availableSwapsByTeacher).sort();
        if (teachers.length > 0) { teachers.forEach(tB => selectB.add(new Option(tB, tB))); } 
        else { selectB.innerHTML = '<option value="">조건에 맞는 대상이 없습니다.</option>'; }
        document.getElementById('tableContainerB').innerHTML = '';
    }

    function onTeacherBChange() {
        const selectedTeacherB = document.getElementById('teacherBSelect').value; selectedTimeB = ""; 
        if (!selectedTeacherB) { document.getElementById('tableContainerB').innerHTML = ''; renderTimetableA(); return; }
        const swapTimes = availableSwapsByTeacher[selectedTeacherB];
        renderTimetableB(selectedTeacherB, swapTimes); renderTimetableA(swapTimes); 
    }

    function selectTimeB(timeY) {
        selectedTimeB = timeY;
        const selectedTeacherB = document.getElementById('teacherBSelect').value;
        const swapTimes = availableSwapsByTeacher[selectedTeacherB];
        renderTimetableB(selectedTeacherB, swapTimes); renderTimetableA(swapTimes);
    }

    function renderTimetableB(teacherB, highlightTimes) {
        let html = `<table><tr><th>교시</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr>`;
        for(let p=1; p<=7; p++) {
            html += `<tr><td>${p}</td>`;
            for(let d=0; d<5; d++) {
                const timeKey = `${days[d]}-${p}`; const subObj = timetableData[teacherB][timeKey];
                const subject = subObj ? subObj.subject : ""; const classRoom = subObj ? subObj.classRoom : "";
                let cellClass = ""; let content = ""; let onClick = "";
                
                if (subObj === undefined && !timetableData[teacherB].hasOwnProperty(timeKey)) { content = `<span class="free-cell"></span>`; } 
                else if (isFree(subject)) { content = `<span class="free-cell"></span>`; } 
                else {
                    if (currentMode === "swap" && (isChangche(subject) || isElective(subject))) {
                        content = `<div style="text-decoration: line-through; color: #aaa;"><b>${subject}</b><span class="class-text">${classRoom}</span></div>`;
                    } else { content = `<b>${subject}</b><span class="class-text">${classRoom}</span>`; }
                }
                
                let isSelectable = highlightTimes.includes(timeKey);
                if (isSelectable) { cellClass += " clickable"; onClick = `onclick="selectTimeB('${timeKey}')"`; }

                if (selectedTimeB === timeKey) { cellClass += " selected-b"; } 
                else if (isSelectable && !selectedTimeB) { cellClass += " selected-b-light"; } 
                else if (selectedTypeA === "regular" && timeKey === selectedTimeA) { cellClass += " selected-b-light"; }
                
                html += `<td class="${cellClass}" ${onClick}>${content}</td>`;
            }
            html += `</tr>`;
        }
        html += `</table>`;
        document.getElementById('tableContainerB').innerHTML = html;
    }

    function resetRightPane() {
        const paneB = document.getElementById('paneB'); paneB.style.opacity = '0.4'; paneB.style.pointerEvents = 'none';
        document.getElementById('teacherBSelect').innerHTML = '<option value="">선택</option>'; document.getElementById('tableContainerB').innerHTML = '';
    }

    function cancelPlan() {
        window.location.href = 'index.html';
    }

    function submitPlan() {
        const teacherB = document.getElementById('teacherBSelect').value;
        if (!currentTeacherA || !selectedTimeA || !teacherB) { alert("결강 교사, 시간, 그리고 대상 교사를 모두 선택해주세요."); return; }

        let planData = {
            mode: currentMode,
            teacherA: currentTeacherA, subjectA: timetableData[currentTeacherA][selectedTimeA].subject,
            classA: timetableData[currentTeacherA][selectedTimeA].classRoom,
            dayA: selectedTimeA.split('-')[0], periodA: selectedTimeA.split('-')[1], teacherB: teacherB
        };

        if (currentMode === 'swap') {
            if (!selectedTimeB) { alert("교체할 대상의 수업 시간을 표에서 클릭하여 선택해주세요."); return; }
            planData.subjectB = timetableData[teacherB][selectedTimeB].subject; planData.classB = timetableData[teacherB][selectedTimeB].classRoom;
            planData.dayB = selectedTimeB.split('-')[0]; planData.periodB = selectedTimeB.split('-')[1];
        } else {
            planData.dayB = planData.dayA; planData.periodB = planData.periodA;
        }
        localStorage.setItem('swapPlanResult', JSON.stringify(planData));
        window.location.href = 'index.html';
    }
